# Phase 1 Elastic Stack — single-node dev, self-signed TLS.
# Bring up with:
#   COMPOSE_PROFILES=elastic docker compose -f compose.elastic.yaml up -d
# Tear down with:
#   docker compose -f compose.elastic.yaml --profile elastic down
# Wipe state:
#   docker compose -f compose.elastic.yaml --profile elastic down -v

name: edr-elastic

x-stack-version: &stack-version "9.3.3"

services:

  # One-shot: generate CA + per-service certs + set kibana_system password.
  # Subsequent runs are a no-op (certs exist, password matches).
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    profiles: [elastic]
    user: "0"
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:-changeme}
    command: >
      bash -c '
        set -eu
        if [ ! -f config/certs/ca.zip ]; then
          echo "Generating CA"
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip
          unzip -o config/certs/ca.zip -d config/certs
        fi
        if [ ! -f config/certs/certs.zip ]; then
          echo "Generating service certs"
          printf "%s\n" \
            "instances:" \
            "  - name: elasticsearch" \
            "    dns: [elasticsearch, localhost]" \
            "    ip:  [127.0.0.1]" \
            "  - name: kibana" \
            "    dns: [kibana, localhost]" \
            "    ip:  [127.0.0.1]" \
            "  - name: fleet-server" \
            "    dns: [fleet-server, localhost]" \
            "    ip:  [127.0.0.1]" \
            > config/certs/instances.yml
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip \
            --in config/certs/instances.yml \
            --ca-cert config/certs/ca/ca.crt \
            --ca-key  config/certs/ca/ca.key
          unzip -o config/certs/certs.zip -d config/certs
        fi
        # Append CA to each service cert so ES/Kibana/Fleet serve the full
        # chain in the TLS handshake. Without this, clients pinning via
        # ca_trusted_fingerprint cannot match — the CA is never presented.
        for svc in elasticsearch kibana fleet-server; do
          CRT=config/certs/$$svc/$$svc.crt
          if [ -f "$$CRT" ] && [ "$$(grep -c -- "-----BEGIN CERTIFICATE-----" $$CRT)" = "1" ]; then
            echo "Appending CA to $$CRT"
            cat config/certs/ca/ca.crt >> $$CRT
          fi
        done
        chmod -R 0750 config/certs
        find config/certs -type f -exec chmod 0640 {} \;
        echo "Waiting for Elasticsearch to come up to set kibana_system password"
        until curl -s --cacert config/certs/ca/ca.crt \
                   -u "elastic:$${ELASTIC_PASSWORD}" \
                   https://elasticsearch:9200 | grep -q "missing authentication credentials\|You Know, for Search"; do
          sleep 5
        done
        echo "Setting kibana_system password"
        until curl -s -X POST --cacert config/certs/ca/ca.crt \
                   -u "elastic:$${ELASTIC_PASSWORD}" \
                   -H "Content-Type: application/json" \
                   https://elasticsearch:9200/_security/user/kibana_system/_password \
                   -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do
          sleep 5
        done
        echo "Setup done"
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f /usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.crt ]"]
      interval: 5s
      timeout: 5s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    profiles: [elastic]
    depends_on:
      setup:
        condition: service_healthy
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-9200}:9200"
    environment:
      - node.name=elasticsearch
      - cluster.name=edr-elastic
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=trial
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-2g} -Xmx${ES_HEAP:-2g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf --cacert config/certs/ca/ca.crt -u elastic:${ELASTIC_PASSWORD:-changeme} https://localhost:9200/_cluster/health | grep -E '\"status\":\"(yellow|green)\"'"
      interval: 10s
      timeout: 10s
      retries: 60

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.3
    profiles: [elastic]
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - certs:/usr/share/kibana/config/certs
      - kibana_data:/usr/share/kibana/data
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-changeme}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=config/certs/kibana/kibana.crt
      - SERVER_SSL_KEY=config/certs/kibana/kibana.key
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-something_at_least_32_characters_long}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_SAVEDOBJECTS_KEY:-another_32_character_encryption_key}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_KEY:-third_32_character_encryption_key_x}
      # Must be reachable from host-installed agents (not just docker-internal DNS).
      # Cert SAN covers IP 127.0.0.1 + DNS fleet-server/localhost — 127.0.0.1
      # works for the host agent (via published port 8220) and the embedded
      # agent inside the fleet-server container (loopback).
      - XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS=["https://127.0.0.1:8220"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf -k https://localhost:5601/api/status | grep -q '\"level\":\"available\"'"
      interval: 10s
      timeout: 10s
      retries: 60

  # Fleet Server. Service token must be provisioned by setup_elastic.py
  # and written to .harness/elastic.env before this service comes up.
  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.3.3
    profiles: [elastic]
    depends_on:
      kibana:
        condition: service_healthy
    env_file:
      - path: .harness/elastic.env
        required: false
    volumes:
      - certs:/certs:ro
      - fleet_server_data:/usr/share/elastic-agent/state
    ports:
      - "${FLEET_PORT:-8220}:8220"
    environment:
      - FLEET_SERVER_ENABLE=true
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://elasticsearch:9200
      - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
      - FLEET_SERVER_SERVICE_TOKEN=${FLEET_SERVER_SERVICE_TOKEN:-}
      - FLEET_SERVER_POLICY_ID=${FLEET_SERVER_POLICY_ID:-fleet-server-policy}
      - FLEET_SERVER_CERT=/certs/fleet-server/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/certs/fleet-server/fleet-server.key
      - FLEET_URL=https://fleet-server:8220
      - FLEET_CA=/certs/ca/ca.crt
      - KIBANA_FLEET_HOST=https://kibana:5601
      - KIBANA_FLEET_CA=/certs/ca/ca.crt
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf -k https://localhost:8220/api/status | grep -q HEALTHY"
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  certs:
  es_data:
  kibana_data:
  fleet_server_data:
